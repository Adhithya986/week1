<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Shopping Cart</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="catalog.html">Catalog</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="cart.html">Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="register.html">Register</a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- Shopping Cart -->
<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">
        Shopping Cart
    </h2>

    <div class="table-responsive">

        <table class="table table-bordered table-hover text-center align-middle">

            <thead class="table-primary">

                <tr>
                    <th>Product</th>
                    <th>Image</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>Laptop</td>

                    <td>
                        <img src="https://via.placeholder.com/80x60?text=Laptop"
                             class="img-thumbnail"
                             alt="Laptop">
                    </td>

                    <td>?55,000</td>

                    <td>
                        <input type="number"
                               class="form-control"
                               value="1"
                               min="1">
                    </td>

                    <td>?55,000</td>

                </tr>

                <tr>

                    <td>Smartphone</td>

                    <td>
                        <img src="https://via.placeholder.com/80x60?text=Phone"
                             class="img-thumbnail"
                             alt="Phone">
                    </td>

                    <td>?25,000</td>

                    <td>
                        <input type="number"
                               class="form-control"
                               value="1"
                               min="1">
                    </td>

                    <td>?25,000</td>

                </tr>

                <tr>

                    <td>Wireless Headphones</td>

                    <td>
                        <img src="https://via.placeholder.com/80x60?text=Headphones"
                             class="img-thumbnail"
                             alt="Headphones">
                    </td>

                    <td>?3,500</td>

                    <td>
                        <input type="number"
                               class="form-control"
                               value="1"
                               min="1">
                    </td>

                    <td>?3,500</td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- Grand Total -->
    <div class="card mt-4">

        <div class="card-body">

            <h4 class="text-end">
                Grand Total :
                <span class="text-success">
                    ?83,500
                </span>
            </h4>

        </div>

    </div>

    <!-- Buttons -->
    <div class="text-center mt-4 mb-5">

        <a href="catalog.html" class="btn btn-secondary btn-lg">
            Continue Shopping
        </a>

        <button class="btn btn-success btn-lg">
            Proceed to Checkout
        </button>

        <button class="btn btn-danger btn-lg">
            Clear Cart
        </button>

    </div>

</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">

    <p class="mb-0">
        © 2026 Shopping Cart System | All Rights Reserved
    </p>

</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
